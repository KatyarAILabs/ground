<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Ground — Verifier Platform (v3)</title>
<style>
/* =========================================================================
   Ground — design system v3 (blue / bright, light-first)
   Spacing scale: 4 8 12 16 24 32 48   ·   Rail: --pad   ·   Header row: --hdr
   ========================================================================= */
:root{
  color-scheme:light;
  --canvas:#f3f4f6; --panel:#ffffff; --panel2:#fafafa; --panel3:#f3f4f6;
  --border:#e7e8ea; --border2:#f0f0f2;
  --text:#111214; --muted:#6b6f76; --faint:#9ca1a9;
  --ink:#111214; --ink-hover:#2a2c31;
  --accent:#2563eb; --accent-hover:#1d4ed8; --accent-bg:#eff4ff; --accent-soft:#dbe6ff;
  --good:#15803d; --good-bg:#dcfce7;
  --warn:#a16207; --warn-bg:#fef3c7;
  --bad:#b91c1c; --bad-bg:#fee2e2;
  --info:#1d4ed8; --info-bg:#dbeafe;
  --purple:#7e22ce; --purple-bg:#f3e8ff;
  --r:14px; --r-sm:10px; --r-lg:18px; --r-pill:999px;
  --shadow:0 1px 2px rgba(17,18,20,.05), 0 18px 44px rgba(17,18,20,.10);
  --shadow-sm:0 1px 2px rgba(17,18,20,.05);
  --pad:24px; --hdr:72px; --gap:16px; --rail:252px;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --canvas:#0e0f11; --panel:#17181b; --panel2:#1d1f22; --panel3:#232529;
  --border:#2a2d32; --border2:#232529;
  --text:#f0f1f3; --muted:#9ba1a9; --faint:#6e747c;
  --ink:#f0f1f3; --ink-hover:#ffffff;
  --accent:#5b8cff; --accent-hover:#4a7dfa; --accent-bg:#182136; --accent-soft:#22304d;
  --good:#5fd18f; --good-bg:#14301f;
  --warn:#e3b45a; --warn-bg:#332813;
  --bad:#f28b85; --bad-bg:#331a19;
  --info:#8ab0ff; --info-bg:#1a2440;
  --purple:#c79bf5; --purple-bg:#2a1c3d;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 18px 44px rgba(0,0,0,.5);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:13.5px/1.55 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  color:var(--text);background:var(--canvas);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;letter-spacing:-.01em}
button{font:inherit;color:inherit}
svg{flex:none}

/* ---------- shell: one card, one grid, two aligned rails ---------- */
#app{height:100vh;padding:12px;display:flex}
.shellcard{flex:1;min-width:0;display:grid;grid-template-columns:var(--rail) 1fr;
  background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);
  box-shadow:var(--shadow-sm);overflow:hidden}

nav{border-right:1px solid var(--border2);padding:0 12px 12px;overflow:auto;display:flex;flex-direction:column}
/* brand row and topbar are the same height so their bottom borders form one line */
.brandrow{height:var(--hdr);flex:none;display:flex;align-items:center;gap:9px;
  padding:0 12px;margin:0 -12px 12px;border-bottom:1px solid var(--border2)}
.brand{display:flex;align-items:center;gap:9px;font-size:14.5px;letter-spacing:-.02em;line-height:1}
.brand b{font-weight:650}.brand .lt{font-weight:400;color:var(--muted)}
.brand .mark{width:22px;height:22px;border-radius:6px;background:var(--ink);position:relative;flex:none}
.brand .mark:after{content:"";position:absolute;left:7px;top:7px;width:8px;height:8px;border-radius:2px;background:var(--panel)}
.navlabel{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);
  padding:0 12px;font-weight:600;height:32px;display:flex;align-items:flex-end;margin-top:12px}
nav button{display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 12px;
  background:none;border:0;border-radius:var(--r-sm);text-align:left;cursor:pointer;color:var(--muted);
  transition:background .12s,color .12s}
nav button+button{margin-top:2px}
nav button:hover{background:var(--panel2);color:var(--text)}
nav button.on{background:var(--accent-bg);color:var(--text);font-weight:600}
nav button .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav .count{font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums;line-height:1}
nav button.on .count{color:var(--muted)}
nav .count.alert{background:var(--bad-bg);color:var(--bad);border-radius:var(--r-pill);
  padding:2px 7px;font-weight:600;font-size:10.5px}
.navspace{flex:1;min-height:16px}
.usercard{display:flex;align-items:center;gap:10px;height:56px;padding:0 24px;margin:0 -12px;
  border-top:1px solid var(--border2);cursor:pointer}
.usercard:hover{background:var(--panel2)}
.usercard .un{font-weight:600;line-height:1.25}
.usercard .ur{font-size:11.5px;color:var(--muted);line-height:1.25}

.frame{min-width:0;display:flex;flex-direction:column}
.topbar{height:var(--hdr);flex:none;display:flex;align-items:center;gap:8px;
  padding:0 var(--pad);border-bottom:1px solid var(--border2)}
.crumb{color:var(--faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;line-height:1}
.crumb b{color:var(--text);font-weight:600}
.crumb .sep{padding:0 6px;color:var(--border)}
.spacer{flex:1}
.selector{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;
  border:1px solid var(--border);border-radius:var(--r-pill);background:var(--panel);
  color:var(--muted);cursor:pointer;font-size:12.5px;line-height:1}
.selector:hover{background:var(--panel2);color:var(--text)}
.selector b{color:var(--text);font-weight:600}
#pal{width:210px;color:var(--faint)}
.kbd{margin-left:auto;border:1px solid var(--border);border-radius:5px;padding:1px 5px;font-size:10.5px;
  color:var(--faint);background:var(--panel2)}
.iconbtn{width:32px;height:32px;display:grid;place-items:center;border-radius:var(--r-pill);
  border:1px solid transparent;background:none;cursor:pointer;color:var(--muted);position:relative}
.iconbtn:hover{background:var(--panel2);color:var(--text)}
.iconbtn .bdg{position:absolute;top:0;right:0;min-width:16px;height:16px;border-radius:var(--r-pill);
  background:var(--bad);color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center;
  padding:0 4px;border:2px solid var(--panel)}
.avatar{width:30px;height:30px;border-radius:var(--r-pill);background:var(--accent-bg);color:var(--text);
  display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}

main{overflow:auto;padding:var(--pad) var(--pad) 64px;flex:1}
.wrap{max-width:1120px}

/* ---------- type ---------- */
.eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);
  font-weight:600;margin-bottom:8px;line-height:1}
h1{font-size:28px;font-weight:650;letter-spacing:-.03em;margin:0 0 4px;line-height:1.15}
h2{font-size:13.5px;font-weight:650;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0;font-size:13.5px}
.pagehead{display:flex;align-items:flex-start;gap:8px;margin-bottom:24px}
.pagehead>div:first-child{flex:1;min-width:0}
.pagehead .btn{margin-top:2px}

/* ---------- surfaces ---------- */
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r)}
.card .hd{min-height:48px;padding:12px 16px;border-bottom:1px solid var(--border2);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card .bd{padding:16px}
.card .bd>table:first-child,.card>table{margin:-16px}
.grid{display:grid;gap:var(--gap)}
.g5{grid-template-columns:repeat(5,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)} .g2{grid-template-columns:1fr 1fr}
@media(max-width:1100px){.g5,.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}}
.stack>*+*{margin-top:var(--gap)}
.row{display:flex;align-items:center;gap:8px}
.wrapx{overflow-x:auto}

/* ---------- buttons ---------- */
.btn{height:32px;padding:0 13px;border:1px solid var(--border);background:var(--panel);border-radius:var(--r-pill);
  cursor:pointer;font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:7px;
  line-height:1;transition:background .12s,border-color .12s;white-space:nowrap}
.btn:hover{background:var(--panel2)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--panel);font-weight:600}
.btn.primary:hover{background:var(--ink-hover);border-color:var(--ink-hover)}
.btn.sm{height:27px;padding:0 11px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.danger:hover{background:var(--bad-bg)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{background:var(--panel2);color:var(--text)}

/* ---------- pills ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:var(--r-pill);
  font-size:11.5px;font-weight:600;border:1px solid transparent;white-space:nowrap;line-height:1}
.pill.ok{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.info{background:var(--info-bg);color:var(--info)}
.pill.neutral{background:var(--panel3);color:var(--muted)}
.dot{width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.dot.live{box-shadow:0 0 0 3px color-mix(in srgb, currentColor 20%, transparent)}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);
  font-weight:600;height:36px;padding:0 16px;border-bottom:1px solid var(--border2);background:var(--panel2)}
td{padding:12px 16px;border-bottom:1px solid var(--border2);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--panel2)}
.num{text-align:right;font-variant-numeric:tabular-nums}
th.num{text-align:right}
.tname{font-weight:600} .tsub{color:var(--muted);font-size:12.5px}

/* ---------- kpi ---------- */
.kpi .bd{display:flex;flex-direction:column;justify-content:flex-start;min-height:104px}
.kpi .v{font-size:27px;font-weight:650;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .k{color:var(--muted);font-size:12.5px;margin-bottom:8px;line-height:1}
.kpi .d{font-size:12.5px;margin-top:auto;padding-top:8px;color:var(--muted)}
.up{color:var(--good)} .down{color:var(--bad)}

.bar{height:6px;background:var(--panel3);border-radius:var(--r-pill);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--ink);border-radius:var(--r-pill)}
.bar.g i{background:var(--good)} .bar.w i{background:var(--warn)} .bar.b i{background:var(--bad)}
.progress{height:5px;background:var(--panel3);border-radius:var(--r-pill);overflow:hidden}
.progress i{display:block;height:100%;background:var(--ink);transition:width .2s;border-radius:var(--r-pill)}

.kv{display:grid;grid-template-columns:160px 1fr;gap:10px 16px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0}

/* ---------- notes ---------- */
.note{background:var(--panel2);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:12px 14px;color:var(--muted)}
.note b,.note strong{color:var(--text)}
.note .btn{margin-left:8px;vertical-align:middle}
.note.bad{border-color:transparent;background:var(--bad-bg);color:var(--bad)}
.note.ok{border-color:transparent;background:var(--good-bg);color:var(--good)}
.note.warn{border-color:transparent;background:var(--warn-bg);color:var(--warn)}
.note.info{border-color:transparent;background:var(--info-bg);color:var(--info)}
.note.bad b,.note.ok b,.note.warn b,.note.info b{color:inherit}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border2);margin-bottom:20px;flex-wrap:wrap}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;height:38px;padding:0 12px;
  cursor:pointer;color:var(--muted);margin-bottom:-1px;font-size:13px}
.tabs button:hover{color:var(--text)}
.tabs button.on{color:var(--text);border-bottom-color:var(--ink);font-weight:600}

/* ---------- forms ---------- */
textarea,input,select{width:100%;font:inherit;color:var(--text);background:var(--panel);
  border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 12px}
textarea{resize:vertical;min-height:82px}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--ink);box-shadow:0 0 0 3px var(--accent-bg)}
input::placeholder,textarea::placeholder{color:var(--faint)}
label.f{display:block;font-weight:600;margin-bottom:6px}
.hint{color:var(--muted);font-size:12.5px;margin-top:6px}

mark{background:#f6e7b4;color:#3c2f04;padding:1px 3px;border-radius:3px}
mark.bad{background:#f7d3d0;color:#5d1a17}
:root[data-theme="dark"] mark{background:#4d411a;color:#f2e4b8}
:root[data-theme="dark"] mark.bad{background:#4f2320;color:#f6cbc7}

/* ---------- messages ---------- */
.msg{border:1px solid var(--border2);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:8px;background:var(--panel2)}
.msg.assistant{background:var(--panel);border-color:var(--border)}
.msg .who{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);
  font-weight:700;margin-bottom:5px}

.split{display:grid;grid-template-columns:1fr 356px;gap:var(--gap);align-items:start}
@media(max-width:1050px){.split{grid-template-columns:1fr}}
.back{background:none;border:0;color:var(--muted);cursor:pointer;padding:0;margin-bottom:10px;
  font-size:12.5px;font-weight:500}
.back:hover{color:var(--text)}

.cm{border-collapse:collapse;font-variant-numeric:tabular-nums}
.cm td,.cm th{border:1px solid var(--border2);padding:12px 16px;text-align:center;height:auto}
.cm th{background:var(--panel2)} .cm td b{font-size:16px}
.tc{border:1px solid var(--border);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:8px;background:var(--panel)}
.tc.agreed{border-color:transparent;background:var(--good-bg)}
.tc.flagged{border-color:transparent;background:var(--bad-bg)}

.flow{display:flex;align-items:center;flex-wrap:wrap;gap:2px;font-size:12.5px}
.flow .step{border:1px solid var(--border);background:var(--panel2);height:28px;padding:0 12px;
  border-radius:var(--r-pill);display:inline-flex;align-items:center}
.flow .step.on{border-color:var(--ink);background:var(--ink);color:var(--panel);font-weight:600}
.flow .step.done{border-color:transparent;background:var(--good-bg);color:var(--good)}
.flow .step.err{border-color:transparent;background:var(--bad-bg);color:var(--bad)}
.flow .arr{color:var(--faint);padding:0 6px}

/* ---------- connectors ---------- */
.logo{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:12px;
  background:var(--panel2);border:1px solid var(--border2);color:var(--muted);flex:none;letter-spacing:-.03em}
.conncard{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:14px;
  cursor:pointer;transition:border-color .12s,box-shadow .12s}
.conncard:hover{border-color:var(--faint);box-shadow:var(--shadow-sm)}
.conncard.off{opacity:.6}

/* ---------- pipeline ---------- */
.pipe{display:grid;grid-template-columns:1fr auto 1fr auto 1fr auto 1fr;align-items:stretch;gap:0}
.pipe .node{border:1px solid var(--border2);border-radius:var(--r-sm);padding:14px 16px;background:var(--panel2)}
.pipe .node .t{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:600}
.pipe .node .n{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.03em;margin:4px 0 2px}
.pipe .link{display:grid;place-items:center;color:var(--faint);padding:0 12px}
@media(max-width:1050px){.pipe{grid-template-columns:1fr}.pipe .link{padding:6px 0;transform:rotate(90deg)}}

.check{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--border2)}
.check:first-child{padding-top:0} .check:last-child{border-bottom:0;padding-bottom:0}
.check .box{width:17px;height:17px;border-radius:5px;border:1px solid var(--border);flex:none;margin-top:1px;
  display:grid;place-items:center;font-size:10px}
.check .box.done{background:var(--good);border-color:var(--good);color:#fff}
.check .box.now{border-color:var(--ink);border-width:2px}

/* ---------- command palette ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,20,19,.32);backdrop-filter:blur(2px);
  display:grid;place-items:start center;padding-top:12vh;z-index:50}
.palette{width:min(580px,92vw);background:var(--panel);border:1px solid var(--border);
  border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.palette input{border:0;border-bottom:1px solid var(--border2);border-radius:0;height:50px;padding:0 18px;font-size:14.5px}
.palette input:focus{outline:0;box-shadow:none}
.palette .item{height:44px;padding:0 18px;display:flex;gap:10px;align-items:center;cursor:pointer;
  border-bottom:1px solid var(--border2)}
.palette .item:hover{background:var(--panel2)}
.palette .item .g{color:var(--faint);font-size:11.5px;margin-left:auto}

.tag{font-size:11.5px;color:var(--muted);border:1px solid var(--border);border-radius:var(--r-pill);
  padding:1px 8px;background:var(--panel2)}
.sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);
  font-weight:600;margin:24px 0 10px}
.sec:first-child{margin-top:0}

@media(max-width:900px){
  #app{padding:0}
  .shellcard{grid-template-columns:1fr;border:0;border-radius:0}
  nav{display:none}
  main{padding:16px 16px 56px}
  .topbar{padding:0 16px}
  h1{font-size:24px}
  .selector.hidesm{display:none}
}


/* =========================================================================
   v3 personality layer — brighter surface, blue accent, softer geometry
   ========================================================================= */
.shellcard{box-shadow:var(--shadow)}
nav{padding:0 12px 0}
.brandrow{border-bottom:1px solid var(--border2)}
.brand{font-family:ui-serif,Georgia,"Times New Roman",serif;font-size:23px;font-weight:600;letter-spacing:-.02em}
.brand .mark{display:none}
.navlabel{text-transform:none;letter-spacing:0;font-size:12.5px;color:var(--muted);height:34px}
nav button{height:40px;border-radius:12px;font-size:13.5px;font-weight:500;gap:11px}
nav button svg{color:var(--faint)}
nav button:hover svg{color:var(--muted)}
nav button.on{background:var(--accent);color:#fff;font-weight:600;box-shadow:0 2px 10px rgba(37,99,235,.26)}
nav button.on svg{color:#fff}
nav button.on .count{color:rgba(255,255,255,.85)}
nav button.on .count.alert{background:rgba(255,255,255,.22);color:#fff}
.navrule{height:1px;background:var(--border2);margin:16px 0 4px}
.dotmark{width:11px;height:11px;border-radius:4px;flex:none}
.usercard{height:64px}

.topbar{gap:12px}
.crumb{display:none}
#pal{flex:1;max-width:520px;height:44px;padding:0 8px 0 16px;background:var(--panel2);
  border-radius:var(--r-pill);font-size:13.5px;gap:11px;width:auto}
#pal:hover{background:var(--panel);border-color:var(--accent-soft)}
.kbd{border-radius:8px;padding:4px 9px;font-size:11.5px;color:var(--muted);background:var(--panel);font-weight:500}
.selector{height:36px;border-radius:var(--r-sm)}
.split-btn{display:inline-flex;align-items:stretch;height:38px;border-radius:var(--r-sm);overflow:hidden;
  box-shadow:0 2px 10px rgba(37,99,235,.26)}
.split-btn .btn.primary{border-radius:0;box-shadow:none;height:38px}
.split-btn .cap{display:grid;place-items:center;width:34px;background:var(--accent-hover);color:#fff;cursor:pointer}
.split-btn .cap:hover{filter:brightness(1.1)}
.iconbtn{width:38px;height:38px}
.iconbtn .bdg{top:5px;right:6px;width:8px;height:8px;min-width:0;padding:0;background:var(--purple);
  border:2px solid var(--panel)}
.avatar{width:38px;height:38px;font-size:12.5px;background:var(--accent-bg);color:var(--accent)}

.eyebrow{text-transform:none;letter-spacing:0;font-size:13.5px;color:var(--muted);font-weight:500;margin-bottom:10px}
h1{font-size:34px;font-weight:700;letter-spacing:-.035em}
h2{font-size:15px;font-weight:650}
.sub{font-size:14px}

.strip{display:flex;align-items:center;flex-wrap:wrap;border:1px solid var(--border);border-radius:var(--r-pill);
  padding:12px 6px;margin:0 0 24px;background:var(--panel);width:fit-content}
.strip .s{display:flex;align-items:center;gap:9px;padding:0 20px;border-right:1px solid var(--border2);
  color:var(--muted);font-size:13.5px;line-height:1}
.strip .s:last-child{border-right:0}
.strip .s b{color:var(--text);font-size:18px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.strip .s svg{color:var(--faint)}

.card .hd{min-height:56px;padding:14px 20px}
.card .bd{padding:20px}
.card .bd>table:first-child,.card>table{margin:-20px}
.btn{height:38px;padding:0 16px;border-radius:var(--r-sm);font-size:13.5px}
.btn.sm{height:31px;padding:0 12px;font-size:12.5px;border-radius:9px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 2px 10px rgba(37,99,235,.26)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{background:var(--panel2);border-color:transparent;border-radius:var(--r-pill)}

.pill{height:24px;padding:0 11px;font-size:12px}
.pill.purple{background:var(--purple-bg);color:var(--purple)}

th{text-transform:none;letter-spacing:0;font-size:12.5px;color:var(--muted);height:48px;padding:0 20px}
td{padding:14px 20px}

.kpi .v{font-size:29px;font-weight:700;letter-spacing:-.035em}
.kpi .k{font-size:13px}
.bar i,.progress i{background:var(--accent)}

.note{border-radius:var(--r-sm);padding:14px 16px}
.tabs{border-bottom:0;background:var(--panel2);border:1px solid var(--border2);border-radius:var(--r-pill);
  padding:4px;width:fit-content;gap:4px;margin-bottom:22px}
.tabs button{height:32px;padding:0 15px;border-bottom:0;border-radius:var(--r-pill);margin-bottom:0}
.tabs button.on{background:var(--panel);box-shadow:var(--shadow-sm);border-bottom:0}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}

mark{background:#fef3c7;color:#713f12;border-radius:5px;padding:1px 4px}
mark.bad{background:#fee2e2;color:#7f1d1d}
:root[data-theme="dark"] mark{background:#3a2f12;color:#f3e2b4}
:root[data-theme="dark"] mark.bad{background:#3d1d1c;color:#f7cac6}

.logo{width:38px;height:38px;border-radius:11px;background:var(--accent-bg);color:var(--accent);border-color:var(--border2)}
.conncard:hover{border-color:var(--accent-soft)}
.flow .step.on{border-color:var(--accent);background:var(--accent);color:#fff}
.check .box{border-radius:var(--r-pill);width:19px;height:19px}
.check .box.done{background:var(--accent);border-color:var(--accent)}
.check .box.now{border-color:var(--accent)}
.palette .item:hover{background:var(--accent-bg)}
.back:hover{color:var(--accent)}
.sec{text-transform:none;letter-spacing:0;font-size:12.5px;color:var(--muted)}

@media(max-width:900px){.topbar{height:64px}h1{font-size:26px}}
</style>

  if(S.tab==='criterion'){body=`
    <div class="split"><div class="stack">
      <div class="card"><div class="hd"><h2>Criterion</h2><span class="spacer"></span><span class="tsub">written by ${v.owner}</span></div>

        <span class="step ${['promoted','drifting'].includes(v.status)?'done':''}">Promote</span><span class="arr">&rarr;</span>
        <span class="step ${v.status==='drifting'?'on':''}">Monitor</span></div>
        <dl class="kv" style="grid-template-columns:120px 1fr">
          <dt>Status</dt><dd><span class="pill ${st.cls}"><i class="dot"></i>${st.label}</span></dd>
          <dt>Owner</dt><dd>${v.owner} · ${v.team}</dd>
          <dt>Runs 7d</dt><dd>${v.runs.toLocaleString()}</dd>
          <dt>Latency p50</dt><dd>${v.latency} ms</dd>
          <dt>Cost / 1k</dt><dd class="mono">${v.cost===0?'₹0':'₹'+(v.cost*1000).toFixed(2)}</dd>
          ${v.pack?`<dt>From pack</dt><dd>${v.pack}</dd>`:''}
          ${v.distilledFrom?`<dt>Distilled from</dt><dd>${v.distilledFrom}</dd>`:''}
          ${v.heldout?`<dt>Held out</dt><dd><span class="pill info"><i class="dot"></i>Evaluation only</span></dd>`:''}
        </dl></div></div>
      ${v.status==='blocked'?`<div class="note bad"><b>Blocked by the promotion gate.</b> Agreement is κ 0.49, below the 0.75 floor. Your two experts disagreed with <i>each other</i> on 31% of the calibration set — the criterion itself is not yet well defined.</div>`:''}
      ${v.status==='drifting'?`<div class="note bad"><b>Drift detected.</b> Agreement fell 0.82 → 0.71 over 14 days. 40 fresh traces added to the review queue.</div>`:''}
      ${v.heldout?`<div class="note info"><b>Held-out verifier.</b> Excluded from every dataset filter and reward signal, used only to evaluate trained models. Without one, an improving score means nothing.</div>`:''}
      ${v.type==='judge'&&v.status==='promoted'?`<div class="note info"><b>Distillation available.</b> 38,210 verdicts collected. A distilled classifier would cut cost per 1,000 from ₹3.10 to about ₹0.20 for an estimated 2-point accuracy loss.</div>`:''}
    </div></div>`;}
  if(S.tab==='calibration'){
    const tp=Math.round(v.labeled*.44),fp=Math.round(v.labeled*(1-v.precision)*.44/v.precision),
          fn=Math.round(v.labeled*.44*(1-v.recall)/v.recall),tn=v.labeled-tp-fp-fn;
    body=`<div class="split"><div class="stack">
      <div class="card"><div class="hd"><h2>Agreement with your experts</h2><span class="spacer"></span><span class="tsub">${v.labeled} labelled examples</span></div>
        <div class="bd"><table class="cm" style="width:auto;margin-bottom:14px">
          <tr><th></th><th>Expert: pass</th><th>Expert: fail</th></tr>

          <tr><th>Verifier: fail</th><td style="background:var(--bad-bg)"><b>${fp}</b><div class="tsub">false alarm</div></td><td style="background:var(--good-bg)"><b>${tp}</b><div class="tsub">agreed</div></td></tr>

        <dl class="kv" style="grid-template-columns:190px 1fr">
          <dt>Precision</dt><dd><b>${pct(v.precision)}</b> <span class="tsub">of flagged failures were real</span></dd>

          <dt>Agreement (Cohen’s κ)</dt><dd><b>${v.kappa.toFixed(2)}</b> <span class="tsub">chance-corrected</span></dd>
          <dt>Expert–expert agreement</dt><dd>${v.status==='blocked'?'<b>0.69</b> <span class="tsub">your experts disagree with each other</span>':'<b>0.91</b>'}</dd>
          <dt>Volume impact</dt><dd>would flag <b>${pct(v.failRate??.09,0)}</b> of live traffic</dd>
        </dl></div></div>
      <div class="card"><div class="hd"><h2>Expert time &amp; leverage</h2></div><div class="bd"><dl class="kv" style="grid-template-columns:190px 1fr">
        <dt>Examples labelled</dt><dd>${v.labeled}</dd>
        <dt>Expert minutes spent</dt><dd>${Math.round(v.labeled*.22)} min across ${v.version} rounds</dd>
        <dt>Traces judged since</dt><dd><b>${v.runs.toLocaleString()}</b></dd>
        <dt>Leverage</dt><dd><b>${v.runs?Math.round(v.runs/v.labeled).toLocaleString()+'×':'—'}</b> <span class="tsub">machine judgments per expert judgment</span></dd>
      </dl></div></div>
    </div><div class="stack">
      <div class="card"><div class="hd"><h2>Promotion gate</h2></div><div class="bd stack">

function impl(v){
  if(v.type==='rule')return `match_currency_amount:  /\\u20b9\\s?[\\d,]+(\\.\\d{2})?/\nmatch_timeline:         /(\\d+)(\\s?[–-]\\s?\\d+)?\\s+(business|working)\\s+days?/i\napplies_when:           intent == "refund_approved"\npass_if:                both matches present`;
  if(v.type==='code')return `def verify(trace):\n    waiver = extract_waiver_amount(trace.reply)\n    if waiver is None:\n        return Verdict.NA\n    if waiver <= 1000:\n        return Verdict.pass_(conf=1.0)\n    ref = find_approval_ref(trace)\n    return Verdict.pass_(conf=0.98) if ref \\\n        else Verdict.fail(conf=0.99,\n              reason=f"waiver {waiver} over threshold, no approval ref")`;
  if(v.type==='judge')return `model:   claude-sonnet-5\nrubric:  policy_4_2.md  (attached, 2 pages)\noutput:  {pass, confidence, reason, evidence_spans}\nguards:  position_swap = on\n         self_preference_check = on\nsample:  1.0 of survivors of tiers 1–2`;
  if(v.type==='model')return `base:     deberta-v3-small (fine-tuned)\ntrained:  38,210 judge verdicts from V-039\nhead:     binary + calibrated confidence\nfallback: escalate to V-039 when conf < 0.70\nserving:  CPU, 36 ms p50`;
  return '';
}

function renderPalette(){
  const m=document.getElementById('modal');
  if(!S.palette){m.innerHTML='';return;}
  const items=[...NAV.flatMap(g=>g.items.map(i=>({t:i.label,g:'Go to',a:()=>go(i.id)}))),
    ...VERIFIERS.map(v=>({t:v.name,g:v.id,a:()=>go('verifiers',{verifier:v.id,tab:'criterion'})})),
    ...SOURCES.filter(c=>c.status!=='available').map(c=>({t:c.name,g:'Connector',a:()=>go('connectors',{conn:c.id})}))];
  const ov=$(`<div class="overlay"><div class="palette"><input placeholder="Search screens, verifiers, connectors…" autofocus>
    <div id="pitems"></div></div></div>`);
  const list=ov.querySelector('#pitems'), inp=ov.querySelector('input');
  const draw=q=>{list.innerHTML='';items.filter(i=>i.t.toLowerCase().includes(q.toLowerCase())).slice(0,8).forEach(i=>{
    const el=$(`<div class="item"><span>${i.t}</span><span class="g">${i.g}</span></div>`);el.onclick=i.a;list.appendChild(el);});};
  draw('');
  inp.oninput=e=>draw(e.target.value);
  ov.onclick=e=>{if(e.target===ov){S.palette=false;renderPalette();}};
  m.innerHTML='';m.appendChild(ov);inp.focus();
}
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();S.palette=!S.palette;renderPalette();}
  if(e.key==='Escape'&&S.palette){S.palette=false;renderPalette();}
});

  studio:'Define / Verifier Studio',library:'Define / Verifier Library',queue:'Define / Review queue',
  policies:'Apply / Policies',datasets:'Apply / Datasets & training'};

function render(){
  renderNav();
  const parts=CRUMB[S.view].split(' / ');
  document.getElementById('crumb').innerHTML=parts.map((p,i)=>i===parts.length-1?`<b>${p}</b>`:p)
    .join('<span class="sep">&rsaquo;</span>');
  const el=document.getElementById('view');
  el.innerHTML=VIEWS[S.view]();
  const h1=el.querySelector('.pagehead h1');
  const today='Wednesday, 9th September';
  if(h1&&!h1.previousElementSibling)h1.insertAdjacentHTML('beforebegin',
    `<div class="eyebrow">${parts.length>1?parts.slice(0,-1).join(' / '):today}</div>`);
  el.querySelectorAll('[data-v]').forEach(n=>n.onclick=()=>go('verifiers',{verifier:n.dataset.v,tab:'criterion'}));
  el.querySelectorAll('[data-t]').forEach(n=>n.onclick=()=>go('traces',{trace:n.dataset.t}));
  el.querySelectorAll('[data-c]').forEach(n=>n.onclick=()=>go('connectors',{conn:n.dataset.c}));
  el.querySelectorAll('[data-goto]').forEach(n=>n.onclick=e=>{e.stopPropagation();go(n.dataset.goto);});
  el.querySelectorAll('[data-tab]').forEach(n=>n.onclick=()=>{S.tab=n.dataset.tab;render();});
  el.querySelectorAll('[data-stab]').forEach(n=>n.onclick=()=>{S.scoreTab=n.dataset.stab;render();});
  el.querySelectorAll('[data-ctab]').forEach(n=>n.onclick=()=>{S.connTab=n.dataset.ctab;render();});
  el.querySelectorAll('[data-case]').forEach(n=>n.onclick=()=>{S.studio.cases[+n.dataset.case].human=n.dataset.ans;render();});
  el.querySelectorAll('[data-q]').forEach(n=>n.onclick=()=>{S.queue[n.dataset.q]=n.dataset.a;render();});
  renderPalette();
}
document.getElementById('pal').onclick=()=>{S.palette=true;renderPalette();};
document.querySelectorAll('.topbar [data-goto]').forEach(n=>n.onclick=()=>go(n.dataset.goto));
document.getElementById('themebtn').onclick=()=>{
  const r=document.documentElement;
  r.setAttribute('data-theme', r.getAttribute('data-theme')==='dark'?'light':'dark');
};
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();S.palette=true;renderPalette();}
  if(e.key==='Escape'&&S.palette){S.palette=false;renderPalette();}
});
render();
</script>
</body>
</html>
