<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ground — Reward Integrity Platform</title>
<style>
:root{
  --canvas:#f4f5f7; --panel:#fff; --panel2:#fafbfc; --border:#dfe2e6; --border2:#eceef0;
  --text:#15181d; --muted:#6a7280; --faint:#9aa1ab;
  --accent:#1f4fb6; --accent-bg:#eef3fd;
  --good:#166b41; --good-bg:#e9f4ee;
  --warn:#8a5800; --warn-bg:#fdf3e0;
  --bad:#a71d26; --bad-bg:#fceded;
  --r:4px; --shadow:0 6px 24px rgba(15,20,30,.13);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --canvas:#101318; --panel:#171a1f; --panel2:#1c2026; --border:#2b3038; --border2:#22262d;
  --text:#e5e8ec; --muted:#98a0ab; --faint:#6d747e;
  --accent:#7ba2f0; --accent-bg:#1a2438;
  --good:#5fc38c; --good-bg:#122a1e;
  --warn:#e0a94a; --warn-bg:#2b2213;
  --bad:#ef8189; --bad-bg:#2e1719;
  --shadow:0 6px 24px rgba(0,0,0,.5);
}}
*{box-sizing:border-box} html,body{margin:0;height:100%}
body{font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--text);background:var(--canvas);-webkit-font-smoothing:antialiased}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
button{font:inherit;color:inherit}
#app{display:grid;grid-template-columns:230px 1fr;grid-template-rows:48px 1fr;height:100vh}
header{grid-column:1/3;display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:14px;letter-spacing:-.01em;padding-right:12px;border-right:1px solid var(--border);height:100%}
.brand .mark{width:18px;height:18px;border:2px solid var(--accent);border-radius:3px;position:relative}
.brand .mark:after{content:"";position:absolute;left:3px;top:3px;width:8px;height:8px;background:var(--accent);border-radius:1px}
.crumb{color:var(--muted)} .crumb b{color:var(--text);font-weight:500}
.spacer{flex:1}
.selector{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 9px;border:1px solid var(--border);
  border-radius:var(--r);background:var(--panel2);color:var(--muted);cursor:pointer}
.selector:hover{border-color:var(--accent)} .selector b{color:var(--text);font-weight:500}
.kbd{border:1px solid var(--border);border-bottom-width:2px;border-radius:3px;padding:0 4px;font-size:11px;color:var(--faint);background:var(--panel)}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--accent-bg);color:var(--accent);display:grid;place-items:center;font-size:11px;font-weight:600;border:1px solid var(--border)}
nav{background:var(--panel);border-right:1px solid var(--border);padding:10px 8px;overflow:auto}
.navlabel{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);padding:11px 8px 5px;font-weight:600}
nav button{display:flex;align-items:center;justify-content:space-between;width:100%;gap:8px;padding:6px 8px;margin-bottom:1px;
  background:none;border:0;border-radius:var(--r);text-align:left;cursor:pointer;color:var(--muted)}
nav button:hover{background:var(--panel2);color:var(--text)}
nav button.on{background:var(--accent-bg);color:var(--accent);font-weight:500}
nav .count{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
nav button.on .count{color:var(--accent)}
nav .count.alert{background:var(--bad);color:#fff;border-radius:9px;padding:0 5px;font-weight:600}
main{overflow:auto;padding:20px 24px 60px} .wrap{max-width:1200px}
h1{font-size:19px;font-weight:600;letter-spacing:-.015em;margin:0 0 3px}
h2{font-size:13px;font-weight:600;margin:0}
.sub{color:var(--muted);margin:0}
.pagehead{display:flex;align-items:flex-start;gap:10px;margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r)}
.card .hd{padding:10px 14px;border-bottom:1px solid var(--border2);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card .bd{padding:14px}
.grid{display:grid;gap:12px}
.g5{grid-template-columns:repeat(5,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}
@media(max-width:1100px){.g5,.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}}
.stack>*+*{margin-top:12px} .row{display:flex;align-items:center;gap:8px} .wrapx{overflow-x:auto}
.btn{height:28px;padding:0 11px;border:1px solid var(--border);background:var(--panel);border-radius:var(--r);cursor:pointer}
.btn:hover{background:var(--panel2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.primary:hover{opacity:.9}
.btn.sm{height:24px;padding:0 8px;font-size:12px}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:1px 7px;border-radius:20px;font-size:11px;font-weight:500;border:1px solid transparent;white-space:nowrap}
.pill.ok{background:var(--good-bg);color:var(--good)}.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.info{background:var(--accent-bg);color:var(--accent)}
.pill.neutral{background:var(--panel2);color:var(--muted);border-color:var(--border)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.dot.live{box-shadow:0 0 0 3px color-mix(in srgb,currentColor 22%,transparent)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:600;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--panel2)}
td{padding:9px 12px;border-bottom:1px solid var(--border2);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--panel2)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.tname{font-weight:500}.tsub{color:var(--muted);font-size:12px}
.kpi .v{font-size:25px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .k{color:var(--muted);font-size:12px;margin-bottom:6px}.kpi .d{font-size:12px;margin-top:4px}
.up{color:var(--good)}.down{color:var(--bad)}
.bar{height:6px;background:var(--border2);border-radius:3px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.g i{background:var(--good)}.bar.w i{background:var(--warn)}.bar.b i{background:var(--bad)}
.progress{height:4px;background:var(--border2);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .2s}
.kv{display:grid;grid-template-columns:150px 1fr;gap:7px 14px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.note{background:var(--panel2);border:1px solid var(--border);border-left:3px solid var(--muted);border-radius:var(--r);padding:10px 12px;color:var(--muted)}
.note.bad{border-left-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.note.ok{border-left-color:var(--good);background:var(--good-bg);color:var(--good)}
.note.warn{border-left-color:var(--warn);background:var(--warn-bg);color:var(--warn)}
.note.info{border-left-color:var(--accent);background:var(--accent-bg);color:var(--accent)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:16px;flex-wrap:wrap}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 11px;cursor:pointer;color:var(--muted);margin-bottom:-1px}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:500}
textarea,input,select{width:100%;font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:7px 10px}
textarea{resize:vertical;min-height:76px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent-bg);border-color:var(--accent)}
label.f{display:block;font-weight:500;margin-bottom:5px}
.hint{color:var(--muted);font-size:12px;margin-top:5px}
mark{background:#fde68a;color:#3a2d00;padding:0 2px;border-radius:2px}
mark.bad{background:#fbcfd2;color:#5c1116}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) mark{background:#5a4a12;color:#f5e6b8}
:root:not([data-theme="light"]) mark.bad{background:#5c2226;color:#f7c9cd}}
.split{display:grid;grid-template-columns:1fr 372px;gap:12px;align-items:start}
@media(max-width:1050px){.split{grid-template-columns:1fr}}
.back{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;margin-bottom:8px;font-size:12px}
.flow{display:flex;align-items:center;flex-wrap:wrap;font-size:12px}
.flow .step{border:1px solid var(--border);background:var(--panel2);padding:5px 10px;border-radius:var(--r)}
.flow .step.on{border-color:var(--accent);background:var(--accent-bg);color:var(--accent);font-weight:500}
.flow .step.done{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.flow .step.err{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.flow .arr{color:var(--faint);padding:0 7px}
.logo{width:30px;height:30px;border-radius:5px;display:grid;place-items:center;font-weight:700;font-size:12px;
  background:var(--panel2);border:1px solid var(--border);color:var(--muted);flex:none;letter-spacing:-.02em}
.conncard{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:12px;cursor:pointer}
.conncard:hover{border-color:var(--accent)} .conncard.off{opacity:.66}
.pipe{display:grid;grid-template-columns:1fr auto 1fr auto 1fr auto 1fr;align-items:stretch}
.pipe .node{border:1px solid var(--border);border-radius:var(--r);padding:11px 13px;background:var(--panel2)}
.pipe .node .t{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:600}
.pipe .node .n{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pipe .link{display:grid;place-items:center;color:var(--faint);padding:0 10px}
@media(max-width:1050px){.pipe{grid-template-columns:1fr}.pipe .link{padding:6px 0;transform:rotate(90deg)}}
.overlay{position:fixed;inset:0;background:rgba(10,14,20,.42);display:grid;place-items:start center;padding-top:12vh;z-index:50}
.palette{width:min(560px,92vw);background:var(--panel);border:1px solid var(--border);border-radius:6px;box-shadow:var(--shadow);overflow:hidden}
.palette input{border:0;border-bottom:1px solid var(--border);border-radius:0;height:44px;padding:0 14px;font-size:14px}
.palette input:focus{outline:0}
.palette .item{padding:9px 14px;display:flex;gap:10px;align-items:center;cursor:pointer;border-bottom:1px solid var(--border2)}
.palette .item:hover{background:var(--accent-bg)} .palette .item .g{color:var(--faint);font-size:11px;margin-left:auto}
.tag{font-size:11px;color:var(--muted);border:1px solid var(--border);border-radius:3px;padding:0 5px;background:var(--panel2)}
/* grade seal */
.seal{border:2px solid var(--border);border-radius:6px;padding:14px 16px;display:flex;gap:14px;align-items:center;background:var(--panel2)}
.seal .g{font-size:38px;font-weight:700;letter-spacing:-.03em;line-height:1}
.seal.ok{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.seal.warn{border-color:var(--warn);background:var(--warn-bg);color:var(--warn)}
.seal.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
/* attack rows */
.atk{border:1px solid var(--border);border-radius:var(--r);background:var(--panel);margin-bottom:8px;overflow:hidden}
.atk .top{padding:10px 12px;display:flex;gap:10px;align-items:center;cursor:pointer}
.atk .top:hover{background:var(--panel2)}
.atk .body{border-top:1px solid var(--border2);padding:12px;background:var(--panel2)}
.ev{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:800px){.ev{grid-template-columns:1fr}}
.ev .box{border:1px solid var(--border);border-radius:var(--r);padding:10px;background:var(--panel)}
.ev .box.reward{border-color:var(--bad)} .ev .box.world{border-color:var(--good)}
.ev .box h3{margin:0 0 6px;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:600}
pre{margin:0;white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;line-height:1.55;color:var(--muted)}
.sec{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:600;margin:20px 0 9px}
.report{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:26px 30px;max-width:860px}
.report h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);margin:24px 0 8px;font-weight:600;border-bottom:1px solid var(--border2);padding-bottom:5px}
.report h3:first-of-type{margin-top:0}
</style>

 <div class="pagehead"><div style="flex:1"><h1>Environments</h1>
 <p class="sub">We do not replace your RL environment. We certify the reward functions inside it.</p></div>
 <button class="btn primary">Connect environment</button></div>
 <div class="note info" style="margin-bottom:14px">Ground is deliberately environment-neutral. A verifier can be certified from a connected environment, or submitted as a standalone artifact by a team or vendor who never connects anything.</div>
 <div class="grid g3">${ENVS.map(e=>`
  <div class="conncard ${e.status==='available'?'off':''}">
   <div class="row" style="align-items:flex-start;margin-bottom:9px"><div class="logo">${e.logo}</div>
   <div style="flex:1"><div class="tname">${e.name}</div><div class="tsub">${e.kind}</div></div>
   <span class="pill ${CONN_STATUS[e.status].cls}"><i class="dot ${e.status==='connected'?'live':''}"></i>${CONN_STATUS[e.status].label}</span></div>
   <dl class="kv" style="grid-template-columns:96px 1fr;font-size:12px">
    <dt>Verifiers</dt><dd>${e.verifiers}</dd><dt>Throughput</dt><dd>${e.runs}</dd></dl>
   <div class="tsub" style="margin-top:8px">${e.note}</div>
  </div>`).join('')}</div>
 <div class="card" style="margin-top:14px"><div class="hd"><h2>What we need from an environment</h2></div><div class="bd">
  <table><thead><tr><th>Requirement</th><th>Why</th></tr></thead><tbody>
   <tr><td>Run a trajectory on demand</td><td class="tsub">The attacker must be able to try things, not just read logs.</td></tr>
   <tr><td>Reset to a known state</td><td class="tsub">An exploit is only a finding if it reproduces.</td></tr>
   <tr><td>Expose the reward function</td><td class="tsub">We certify the function, not a score.</td></tr>
   <tr><td>Read-only access to world state</td><td class="tsub">Adjudication. This is the requirement most environments do not meet.</td></tr>
  </tbody></table></div></div>`;
}

function vOracles(){
 return `
 <div class="pagehead"><div style="flex:1"><h1>Oracles &amp; evidence</h1>
 <p class="sub">The systems that settle whether an exploit is real. Never another model.</p></div>
 <button class="btn primary">Add oracle</button></div>
 <div class="note info" style="margin-bottom:14px"><b>The recursion problem.</b> If a model decides whether a reward function was fooled, you have replaced one unverified judgment with another. Ground only reports a finding when an independent system of record contradicts the reward. Everything else goes to a human. This is why the connectors below are the product, not plumbing.</div>
 <div class="grid g4" style="margin-bottom:14px">
  ${kpi('Oracles connected','7','across 6 systems','')}
  ${kpi('Adjudicable trajectories','81%','the rest cannot be proven either way','')}
  ${kpi('Max oracle lag','46 min','core banking — above threshold','down')}
  ${kpi('Findings held','4','awaiting fresh oracle state','down')}
 </div>
 <div class="grid g3">${ORACLES.map(o=>`
  <div class="conncard ${o.status==='available'?'off':''}">
   <div class="row" style="align-items:flex-start;margin-bottom:9px"><div class="logo">${o.logo}</div>
   <div style="flex:1"><div class="tname">${o.name}</div><div class="tsub">${o.cat}</div></div>
   <span class="pill ${CONN_STATUS[o.status].cls}"><i class="dot ${o.status==='live'?'live':''}"></i>${CONN_STATUS[o.status].label}</span></div>
   <dl class="kv" style="grid-template-columns:82px 1fr;font-size:12px">
    <dt>Lag</dt><dd class="${o.status==='degraded'?'down':''}">${o.lag}</dd>
    <dt>Strength</dt><dd>${o.strength==='strong'?'<span class="pill ok">strong</span>':o.strength==='medium'?'<span class="pill neutral">medium</span>':'—'}</dd>
    <dt>Signals</dt><dd class="tsub mono" style="font-size:11px">${o.signals}</dd></dl>
   <div class="tsub" style="margin-top:8px">${o.note}</div>
  </div>`).join('')}</div>
 <div class="note" style="margin-top:14px"><b>Oracle strength matters more than oracle count.</b> Stripe and Git are strong because the agent cannot rewrite history there. A CRM field the agent can edit is a weak oracle and is treated as evidence, not proof.</div>`;
}

/* ================= PALETTE ================= */
function renderPalette(){
 const m=document.getElementById('modal');
 if(!S.palette){m.innerHTML='';return;}
 const items=[...NAV.flatMap(g=>g.items.map(i=>({t:i.label,g:'Go to',a:()=>go(i.id)}))),
  ...VERIFIERS.map(v=>({t:v.name,g:v.id,a:()=>go('registry',{vf:v.id,tab:'objective'})})),
  ...EXPLOITS.map(e=>({t:e.title,g:e.id,a:()=>{S.exp[e.id]=true;go('attack');}}))];
 const ov=$(`<div class="overlay"><div class="palette"><input placeholder="Search verifiers, exploits, screens…"><div id="pitems"></div></div></div>`);
 const list=ov.querySelector('#pitems'),inp=ov.querySelector('input');
 const draw=q=>{list.innerHTML='';items.filter(i=>i.t.toLowerCase().includes(q.toLowerCase())).slice(0,8).forEach(i=>{
  const el=$(`<div class="item"><span>${i.t}</span><span class="g">${i.g}</span></div>`);el.onclick=i.a;list.appendChild(el);});};
 draw('');inp.oninput=e=>draw(e.target.value);
 ov.onclick=e=>{if(e.target===ov){S.palette=false;renderPalette();}};
 m.innerHTML='';m.appendChild(ov);inp.focus();
}
document.addEventListener('keydown',e=>{
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();S.palette=!S.palette;renderPalette();}
 if(e.key==='Escape'&&S.palette){S.palette=false;renderPalette();}});

/* ================= RENDER ================= */
const VIEWS={overview:vOverview,environments:vEnvironments,oracles:vOracles,registry:vRegistry,
 attack:vAttack,synthesize:vSynthesize,adjudicate:vAdjudicate,certificate:vCertificate,monitor:vMonitor,gate:vGate};
const CRUMB={overview:'Overview',environments:'Evidence / Environments',oracles:'Evidence / Oracles & evidence',
 registry:'Verify / Verifier registry',attack:'Verify / Attack console',synthesize:'Verify / Synthesize',
 adjudicate:'Verify / Adjudication',certificate:'Trust / Certificates',monitor:'Trust / Monitor',gate:'Trust / Training gate'};

function render(){
 renderNav();
 document.getElementById('crumb').innerHTML=CRUMB[S.view].replace(/\/ (.+)$/,'/ <b>$1</b>');
 const el=document.getElementById('view');
 el.innerHTML=VIEWS[S.view]();
 el.querySelectorAll('[data-vf]').forEach(n=>n.onclick=e=>{e.stopPropagation();go('registry',{vf:n.dataset.vf,tab:'objective'});});
 el.querySelectorAll('[data-goto]').forEach(n=>n.onclick=e=>{e.stopPropagation();go(n.dataset.goto);});
 el.querySelectorAll('[data-tab]').forEach(n=>n.onclick=()=>{S.tab=n.dataset.tab;render();});
 el.querySelectorAll('[data-ex]').forEach(n=>n.onclick=()=>{S.exp[n.dataset.ex]=!S.exp[n.dataset.ex];render();});
 el.querySelectorAll('[data-adj]').forEach(n=>n.onclick=()=>{S.adj[n.dataset.adj]=n.dataset.a;render();});
 const s1=el.querySelector('#syn1');if(s1)s1.onclick=()=>{S.syn.text=el.querySelector('#obj').value;S.syn.step=1;render();};
 const s2=el.querySelector('#syn2');if(s2)s2.onclick=()=>{S.syn.step=2;render();};
 const ra=el.querySelector('#runatk');
 if(ra)ra.onclick=()=>{
   if(S.atkRunning)return;
   S.atkRunning=true;S.atkProgress=0;render();
   const t=setInterval(()=>{S.atkProgress+=10;if(S.atkProgress>=100){S.atkProgress=100;clearInterval(t);
     setTimeout(()=>{S.atkRunning=false;render();},1200);}render();},260);
 };
 renderPalette();
}
document.getElementById('pal').onclick=()=>{S.palette=true;renderPalette();};
render();
</script>
</body>
