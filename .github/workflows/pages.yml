# Publish the prototypes to GitHub Pages, with v2 as the landing page.
name: Deploy prototype to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site
          cp prototype.html prototype.v1.html prototype.v2.html _site/
          # v2 is the version we serve at the root
          cp prototype.v2.html _site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Turn Pages on (Actions source) if it isn't already enabled
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
